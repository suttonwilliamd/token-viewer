name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser
      - name: Dependency audit (reports known advisories; does not hide output)
        run: npm audit
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-${{ matrix.os }}
          path: artifacts/browser-smoke
          if-no-files-found: warn
